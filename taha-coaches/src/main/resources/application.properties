spring.application.name=taha-coaches

# Local-only secrets. Ignored by git; absent on Heroku (where config vars supply the values).
# Because it is imported LAST, its values win locally; the ${...} refs below win on Heroku.
spring.config.import=optional:classpath:secrets.properties

# Server / proxy (Heroku terminates TLS at its router and forwards via X-Forwarded-* headers).
# forward-headers-strategy=native makes Spring see the request as HTTPS, so OAuth {baseUrl}
# redirect URIs and Secure cookies are generated correctly behind the proxy.
server.port=${PORT:8080}
server.forward-headers-strategy=native
# Cross-site cookie for the Vercel frontend. Locally these default to lax/false (plain HTTP);
# on Heroku set COOKIE_SAMESITE=none and COOKIE_SECURE=true.
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

#db credentials
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#jpa settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#oauth2 vars
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Base URL for local dev
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

#facebook oauth2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/facebook}

frontend.url=${FRONTEND_URL:http://localhost:4200}

# Comma-separated list of emails that get the ADMIN role on login
app.admin-emails=tahatrains20@gmail.com,t.ghailan@axelor.com

# Booking rules
booking.min-notice-hours=12
booking.horizon-days=28
booking.cancel-cutoff-hours=12
booking.pending-expiry-hours=48
booking.grid-minutes=30

#R2 storage
# Cloudflare R2
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.accessKey=${R2_ACCESS_KEY}
cloudflare.r2.secretKey=${R2_SECRET_KEY}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.id=${R2_ID}
cloudflare.r2.publicEndpoint=${R2_PUBLIC_ENDPOINT}
